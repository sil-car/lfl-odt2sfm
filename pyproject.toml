[build-system]
requires = ["flit_core <5"]
build-backend = "flit_core.buildapi"

[project]
name = "odt2sfm"
description = "Convert ODT documents to SFM text and vice versa."
readme = "README.md"
authors = [{name = "Nate Marti", email = "nate_marti@sil.org"}]
dependencies = [
    "odfdo",
]
license = "MIT"
requires-python = ">=3.12"
dynamic = ["version"]

[project.optional-dependencies]
dev = [
    "pyright",
    "pytest>=7",
    "pytest-cov",
    "ruff",
]

[project.scripts]
odt2sfm = "odt2sfm.__main__:main"
odt2sfm-normalize-files = "odt2sfm.scripts.normalize_files:main"
odt2sfm-normalize-project = "odt2sfm.scripts.normalize_project:main"
odt2sfm-odt-styles = "odt2sfm.odt.__main__:odt_styles"

[tool.pyright]
venvPath = "."
venv = "env"
typeCheckingMode = "standard"
