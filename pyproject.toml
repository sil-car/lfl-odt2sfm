[build-system]
requires = ["flit_core <5"]
build-backend = "flit_core.buildapi"

[project]
name = "odt2sfm"
description = "Convert ODT documents to SFM text and vice versa."
readme = "README.md"
authors = [{name = "Nate Marti", email = "nate_marti@sil.org"}]
dependencies = [
    "odfdo",
]
license = "MIT"
requires-python = ">=3.12"
dynamic = ["version"]

[project.optional-dependencies]
dev = [
    "pyright",
    "pytest>=7",
    "pytest-cov",
    "ruff",
]

[project.scripts]
odt2sfm = "odt2sfm.__main__:main"
odt2sfm-normalize-files = "odt2sfm.scripts.normalize_files:main"
odt2sfm-normalize-project = "odt2sfm.scripts.normalize_project:main"
odt2sfm-odt-paragraphs = "odt2sfm.odt.__main__:odt_paragraphs"
odt2sfm-sfm-paragraphs = "odt2sfm.sfm.__main__:sfm_paragraphs"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
xfail_strict = true
markers = [
    "realdata: tests that use real Lessons-from-Luke ODT files in tests/data/real",
    "cli: tests that exercise command-line entry points",
]

[tool.coverage.run]
source = ["odt2sfm"]
branch = true

[tool.coverage.report]
exclude_also = ['if __name__ == "__main__":']

[tool.ruff]
src = ["src", "tests"]
extend-exclude = ["scripts"]

[tool.pyright]
venvPath = "."
venv = "env"
typeCheckingMode = "standard"
